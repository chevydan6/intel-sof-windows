name: Build N100 ACX speaker prototype

on:
  push:
    paths:
      - 'driver/acx/**'
      - 'driver/sofprobe.c'
      - 'driver/sofprobe-ioctl.h'
      - 'tools/test-audio-format.py'
      - '.github/workflows/build-acx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test-audio-format.py
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build with Windows Driver Kit
        shell: pwsh
        run: msbuild driver/acx/sofplay.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal
      - name: Verify generated INF independently
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Tools' -Recurse -Filter InfVerif.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -Last 1
          if (-not $tool) { throw 'x64 InfVerif.exe was not found in the WDK' }
          & $tool.FullName /w driver/acx/x64/Debug/sofplay.inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: sofplay-development-package
          path: driver/acx/x64/Debug/sofplay/
          if-no-files-found: error
